<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenVPN Controller</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <script defer src="https://use.fontawesome.com/releases/v6.4.0/js/all.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.3"
    integrity="sha384-lVb3Rd/Ca0AxaoZg5sACe8FJKF0tnUgR2Kd7ehUOG5GCcROv5uBIZsOqovBAcWua"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
  <style>
    :root {
      --bg-body: #ffffff;
      --bg-section: #f5f5f5;
      --bg-box: #ffffff;
      --text-color: #363636;
      --text-strong: #363636;
      --label-color: #363636;
      --input-bg: #ffffff;
      --input-color: #363636;
      --input-border: #dbdbdb;
      --border-color: #dbdbdb;
      --box-shadow: 0 0.5em 1em -0.125em rgba(10,10,10,.1), 0 0 0 1px rgba(10,10,10,.02);
    }

    [data-theme="dark"] {
      --bg-body: #1a1a2e;
      --bg-section: #16213e;
      --bg-box: #1f2b47;
      --text-color: #e0e0e0;
      --text-strong: #f0f0f0;
      --label-color: #c8c8d0;
      --input-bg: #2a3a5c;
      --input-color: #e0e0e0;
      --input-border: #3a4a6c;
      --border-color: #3a4a6c;
      --box-shadow: 0 0.5em 1em -0.125em rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.1);
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    .section {
      background-color: var(--bg-section);
    }

    .box {
      background-color: var(--bg-box);
      color: var(--text-color);
      box-shadow: var(--box-shadow);
    }

    .label {
      color: var(--label-color);
    }

    .input {
      background-color: var(--input-bg);
      color: var(--input-color);
      border-color: var(--input-border);
    }

    .input::placeholder {
      color: color-mix(in srgb, var(--input-color) 50%, transparent);
    }

    [data-theme="dark"] .input:focus {
      border-color: #485fc7;
      box-shadow: 0 0 0 0.125em rgba(72, 95, 199, 0.25);
    }

    [data-theme="dark"] .input.is-success {
      border-color: #48c78e;
    }

    [data-theme="dark"] .input.is-danger {
      border-color: #f14668;
    }

    .icon-text .icon, .icon-text span {
      color: var(--text-color);
    }

    .title, .subtitle, strong {
      color: var(--text-strong);
    }

    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 100;
      background: var(--bg-box);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: var(--box-shadow);
      transition: background-color 0.3s, border-color 0.3s;
    }

    .theme-toggle:hover {
      opacity: 0.8;
    }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <script>
    htmx.logger = function (elt, event, data) {
      if (console) {
        console.log(event, elt, data);
      }
    }
  </script>
</head>

<body>
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
    <span id="theme-icon"></span>
  </button>
  <script>
    function applyThemeIcon() {
      var icon = document.getElementById('theme-icon');
      if (icon) {
        icon.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
      }
    }
    function toggleTheme() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
      applyThemeIcon();
    }
    applyThemeIcon();
  </script>
  <section class="section">
    <div class="container">
      <div class="columns">
        {{ block "credentials" .}}
        <div class="column" id="credentials" hx-swap-oob="true">
          <form class="box" method="POST" hx-target="#connected" hx-post="/connect" hx-swap="innerHTML">
            <div class="field">
              <label class="label">Username</label>
              <div class="control has-icons-left has-icons-right">
                <input name="username" class="input is-success" type="text" placeholder="Text input" value="" required>
                <span class="icon is-small is-left">
                  <i class="fas fa-user"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">Password</label>
              <div class="control has-icons-left has-icons-right">
                <input name="password" class="input is-danger" type="password" placeholder="Password" value="" required>
                <span class="icon is-small is-left">
                  <i class="fas fa-lock"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">OTP</label>
              <div class="control has-icons-left">
                <input name="one-time-code" autocomplete="one-time-code" class="input is-success" type="text"
                  placeholder="123 456" value="" required>
                <span class="icon is-small is-left">
                  <i class="fas fa-lock"></i>
                </span>
              </div>
            </div>

            <div class="field is-grouped">
              <div class="control">
                <button type="submit" class="button is-link">Connect</button>
              </div>
            </div>
          </form>
        </div>
        {{ end }}
        {{ block "check-list-item" . }}
        <div class="column" id="status">
          {{ range .Checks }}
          <div class="box">
            <div class="icon-text">
              <span class="icon">
                <i class="fas {{ .Icon }}"></i>
              </span>
              <span>{{ .Status }}</span>
            </div>
          </div>
          {{ end }}
        </div>
        {{ end }}
      </div>
    </div>
  </section>
</body>
<section class="section">
  <div class="container">
    <div class="columns">
      <div class="column">
        <div class="box">
          {{ block "vpn" . }}
          <div class="is-family-monospace is-size-7" id="connected">
            {{ .PID }} {{ .Status }}
          </div>
          {{ end }}
        </div>
      </div>
    </div>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="columns">
      <div class="column">
        <div class="box">
          <div hx-ext="ws" ws-connect="/updatews">
            {{ block "log" . }}
            <div class="is-family-monospace is-size-7" id="log">
              {{ range .Log }}
              {{ .Line }}<br>
              {{ end }}
            </div>
            {{ end }}
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
</section>

</html>
