name: ci

# `just check` runs the same checks locally.
# Renovate merges its own non-major PRs only when this is green. Merging never
# deploys: the pod is restarted by hand, since a restart drops the work VPN and
# needs a fresh OTP code.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Keep in step with the golang: tag in the Dockerfile.
          go-version: "1.27.3"
      - run: go vet ./...
      - run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0
      - name: govulncheck
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.9.0
        run: go run golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t openvpn-controller:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      # The CLI, not gitleaks-action: the action left MIT at v2.
      - name: gitleaks
        env:
          # renovate: datasource=go depName=github.com/zricethezav/gitleaks/v8
          GITLEAKS_VERSION: v8.30.1
        run: go run github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION git --redact -v .
